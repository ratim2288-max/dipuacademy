<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dipu Academy Bookshop — সেরা শিক্ষার্থীদের প্রয়োজনীয় বই ও বুকশপ</title>
  <meta name="description" content="Dipu Academy বুকশপ — HSC, SSC ও স্কুল লেভেলের সেরা মাস্টারবুক, ডিজিটাল ই-বুক ও বান্ডেল কালেকশন।">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/dipu-logo.png?v=5">
  <link rel="shortcut icon" href="/favicon.ico?v=5">
  <link rel="apple-touch-icon" href="/images/dipu-logo.png?v=5">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=3.6">

  <style>
    :root {
      --cyan: #00C2FF;
      --blue: #0084FF;
      --orange: #FF7A1A;
      --ink: #050B17;
      --card-bg: #0D1526;
      --card-border: rgba(255,255,255,0.08);
      --text: #FFFFFF;
      --muted: #94A3B8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hind Siliguri', 'Inter', system-ui, sans-serif;
      color: var(--text);
      background: #080B16;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }

    /* ============================================================
       HERO BANNER SLIDER
       ============================================================ */
    .hero-slider {
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      background: #070d18;
    }

    .hero-track {
      display: flex;
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    .hero-slide {
      flex: 0 0 100%;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .hero-slide img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      object-position: center;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }



    /* Slider Controls */
    .slider-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #FFFFFF;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }

    .slider-arrow:hover {
      background: rgba(0,194,255,0.3);
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(0,194,255,0.4);
    }

    .slider-arrow.prev { left: 16px; }
    .slider-arrow.next { right: 16px; }

    /* Dot indicators */
    .slider-dots {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 9px;
      z-index: 10;
    }

    .slider-dot {
      width: 28px;
      height: 4px;
      border-radius: 99px;
      background: rgba(255,255,255,0.3);
      cursor: pointer;
      transition: all 0.35s ease;
      border: none;
      padding: 0;
    }

    .slider-dot.active {
      background: var(--cyan);
      width: 44px;
      box-shadow: 0 0 10px var(--cyan);
    }

    /* ============================================================
       MAIN CATALOG
       ============================================================ */
    .wrap {
      max-width: 1200px;
      margin: auto;
      padding: 0 20px;
    }

    /* Filter & Search Row */
    .search-filter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin: 36px 0 24px;
    }

    .pills {
      display: inline-flex;
      gap: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      padding: 6px;
      border-radius: 14px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 9px 18px;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid transparent;
      font-family: inherit;
      transition: all 0.22s ease;
    }

    .pill:hover {
      background: rgba(0,194,255,0.1);
      color: #FFFFFF;
      border-color: rgba(0,194,255,0.3);
    }

    .pill.on {
      background: linear-gradient(135deg, rgba(0,132,255,0.25), rgba(0,194,255,0.15));
      color: var(--cyan);
      border-color: rgba(0,194,255,0.5);
      box-shadow: 0 0 14px rgba(0,194,255,0.15);
    }

    /* Search */
    .shop-search-box {
      position: relative;
      min-width: 260px;
      max-width: 340px;
      flex: 1;
    }

    .shop-search-box input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 11px 16px 11px 42px;
      color: #FFFFFF;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .shop-search-box input:focus {
      border-color: var(--cyan);
      background: rgba(0,194,255,0.06);
      box-shadow: 0 0 0 3px rgba(0,194,255,0.12);
    }

    .shop-search-box input::placeholder { color: var(--muted); }

    .shop-search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    /* Section Header */
    .sec-h {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .sec-h h2 {
      font-size: 24px;
      font-weight: 800;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sec-h a {
      font-weight: 700;
      color: var(--cyan);
      font-size: 14px;
      transition: color 0.2s;
    }

    .sec-h a:hover { color: var(--blue); }

    /* ============================================================
       BOOK CARDS
       ============================================================ */
    .rail {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 22px;
      margin-bottom: 80px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 0;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.25s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(0,194,255,0.06), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 0;
    }

    .card:hover::before { opacity: 1; }

    .card:hover {
      box-shadow: 0 24px 50px -8px rgba(0,0,0,0.8), 0 0 35px rgba(0,194,255,0.18);
      border-color: rgba(0,194,255,0.45);
      transform: translateY(-8px);
    }

    .card.hide { display: none; }

    /* Book Cover Area */
    .cover-box {
      position: relative;
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.35) 100%);
    }

    /* Discount badge */
    .discount-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 5;
      background: linear-gradient(135deg, #FF3D71, #e02057);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(255,61,113,0.5);
      letter-spacing: 0.3px;
    }

    /* 3D Book Cover */
    .book-cover-3d {
      width: 130px;
      height: 185px;
      border-radius: 4px 14px 14px 4px;
      box-shadow:
        -10px 14px 28px rgba(0,0,0,0.7),
        inset 6px 0 0 rgba(255,255,255,0.2),
        inset -2px 0 0 rgba(0,0,0,0.3);
      padding: 14px 12px;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      line-height: 1.3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      transform: rotateY(-22deg) perspective(600px);
      border: 1px solid rgba(255,255,255,0.18);
      position: relative;
      overflow: hidden;
    }

    /* Shine effect on book */
    .book-cover-3d::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 55%;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), transparent);
      border-radius: 4px 14px 0 0;
      pointer-events: none;
    }

    .card:hover .book-cover-3d {
      transform: rotateY(0) perspective(600px) scale(1.07);
      box-shadow:
        -2px 18px 40px rgba(0,0,0,0.65),
        inset 6px 0 0 rgba(255,255,255,0.28),
        inset -2px 0 0 rgba(0,0,0,0.2);
    }

    .book-cover-3d .book-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.85;
      background: rgba(0,0,0,0.25);
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
    }

    .book-cover-3d .book-title {
      font-size: 14px;
      font-weight: 900;
      line-height: 1.25;
    }

    .book-cover-3d .book-sub {
      font-size: 9.5px;
      font-weight: 600;
      opacity: 0.9;
      letter-spacing: 0.3px;
    }

    /* Card Info */
    .card-info {
      padding: 16px 18px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }

    .card h3 {
      font-size: 16px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 5px;
      line-height: 1.35;
    }

    .card .meta {
      color: var(--muted);
      font-size: 12.5px;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 14px;
    }

    .card .meta i {
      color: var(--cyan);
      font-size: 11px;
    }

    /* Star Rating */
    .card-stars {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 14px;
    }

    .card-stars .stars {
      color: #FBBF24;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .card-stars .rating-count {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    /* Price row */
    .price {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .price-group {
      display: flex;
      align-items: baseline;
      gap: 7px;
    }

    .price b {
      font-size: 21px;
      color: #FFFFFF;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
    }

    .price s {
      color: #4B5563;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
    }

    .buy-btn {
      background: linear-gradient(135deg, rgba(0,132,255,0.2), rgba(0,194,255,0.12));
      border: 1px solid rgba(0,194,255,0.4);
      color: var(--cyan);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.22s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .card:hover .buy-btn {
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      color: #FFFFFF;
      border-color: transparent;
      box-shadow: 0 6px 18px rgba(0,194,255,0.4);
      transform: scale(1.05);
    }

    /* ============================================================
       ANIMATIONS
       ============================================================ */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card {
      animation: cardFadeIn 0.5s ease both;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 640px) {
      .hero-slide img { height: 260px; }
      .hero-slide-title { font-size: 22px; }
      .hero-slide-sub { font-size: 13px; display: none; }
      .hero-slide-cta { padding: 11px 22px; font-size: 14px; }
      .slider-arrow { width: 36px; height: 36px; font-size: 13px; }
      .slider-arrow.prev { left: 8px; }
      .slider-arrow.next { right: 8px; }
      .search-filter-row { flex-direction: column; align-items: stretch; gap: 12px; }
      .shop-search-box { max-width: 100%; }
      .rail { grid-template-columns: 1fr 1fr; gap: 12px; }
      .cover-box { height: 190px; }
      .book-cover-3d { width: 105px; height: 150px; font-size: 11px; }
      .card h3 { font-size: 14px; }
      .price b { font-size: 17px; }
    }

    @media (max-width: 380px) {
      .rail { grid-template-columns: 1fr; }
    }

    @media (min-width: 641px) and (max-width: 1024px) {
      .hero-slide img { height: 340px; }
      .rail { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    }
  </style>
</head>
<body>

  <!-- REACT NAVBAR BUNDLE MOUNT -->
  <div id="site-navbar-root"></div>

  <!-- ============================================================
       HERO BANNER SLIDER (3 Image Banners)
       ============================================================ -->
  <section class="hero-slider" id="heroSlider" aria-label="প্রমোশনাল ব্যানার">
    
    <!-- Slider Track -->
    <div class="hero-track" id="heroTrack">

      <!-- Banner 1: Main Books Store -->
      <div class="hero-slide">
        <img src="/images/shop-banner-1.jpg" alt="সেরা বইয়ের সংগ্রহ — Dipu Academy Bookshop" draggable="false">
      </div>

      <!-- Banner 2: Limited Offer -->
      <div class="hero-slide">
        <img src="/images/shop-banner-2.jpg" alt="লিমিটেড অফার — ২৫% বিশেষ ছাড়" draggable="false">
      </div>

      <!-- Banner 3: Digital E-Books -->
      <div class="hero-slide">
        <img src="/images/shop-banner-3.jpg" alt="ডিজিটাল ই-বুক — সাথে সাথে ডাউনলোড" draggable="false">
      </div>

    </div><!-- /.hero-track -->

    <!-- Arrow Controls -->
    <button class="slider-arrow prev" id="sliderPrev" aria-label="আগের ব্যানার">
      <i class="fas fa-chevron-left"></i>
    </button>
    <button class="slider-arrow next" id="sliderNext" aria-label="পরের ব্যানার">
      <i class="fas fa-chevron-right"></i>
    </button>

    <!-- Dot Indicators -->
    <div class="slider-dots" id="sliderDots" role="tablist" aria-label="ব্যানার নেভিগেশন">
      <button class="slider-dot active" data-idx="0" aria-label="ব্যানার ১"></button>
      <button class="slider-dot" data-idx="1" aria-label="ব্যানার ২"></button>
      <button class="slider-dot" data-idx="2" aria-label="ব্যানার ৩"></button>
    </div>

  </section>


  <!-- ============================================================
       MAIN CATALOG CONTENT
       ============================================================ -->
  <main class="wrap">

    <!-- Search & Filter Controls -->
    <div class="search-filter-row">
      <div class="pills" id="pills" role="group" aria-label="বই ক্যাটাগরি ফিল্টার">
        <button class="pill on" data-c="all">সব</button>
        <button class="pill" data-c="hsc">এইচএসসি</button>
        <button class="pill" data-c="ssc">এসএসসি</button>
        <button class="pill" data-c="9">নবম শ্রেণি</button>
        <button class="pill" data-c="8">অষ্টম শ্রেণি</button>
        <button class="pill" data-c="7">৭ম শ্রেণি</button>
        <button class="pill" data-c="6">ষষ্ঠ শ্রেণি</button>
        <button class="pill" data-c="ebook" style="color:#7c5cff; border-color: rgba(124,92,255,0.4);">📱 ই-বুক PDF</button>
      </div>

      <div class="shop-search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="shopSearchInput" placeholder="বইয়ের নাম বা বিষয় খুঁজুন...">
      </div>
    </div>

    <div class="sec-h">
      <h2>
        <i class="fas fa-book-bookmark" style="color: var(--cyan);"></i>
        <span>বইয়ের সংগ্রহ</span>
      </h2>
      <a href="javascript:void(0)" onclick="resetFilters()">সব দেখুন ›</a>
    </div>

    <!-- Product Grid -->
    <div class="rail" id="rail"></div>

  </main>


  <script>
    /* ============================================================
       BOOK CATALOG DATA
       [cat, title, subtitle, price, origPrice, gradient, id, rating, reviews, discount, img, type]
       type: 'book' | 'ebook'
       ============================================================ */
    const books = [
      /* ── ছবি সহ বই ── */
      ['hsc','জীববিজ্ঞান Masterbook','HSC • ১ম ও ২য় পত্র',460,570,'','book-hsc-biology',4.9,185,'19% ছাড়','/images/books/book-hsc-biology.jpg','book'],
      ['hsc','English Masterbook','HSC • Grammar & Literature',440,540,'','book-hsc-english',4.8,162,'19% ছাড়','/images/books/book-hsc-english.jpg','book'],
      ['ssc','বাংলা মাস্টারবুক','SSC • সাহিত্য ও ব্যাকরণ',330,420,'','book-ssc-bangla',4.8,204,'21% ছাড়','/images/books/book-ssc-bangla.jpg','book'],
      ['ssc','পদার্থবিজ্ঞান Physics Guide','SSC • পদার্থবিজ্ঞান সমাধান',340,430,'','book-ssc-physics',4.7,178,'21% ছাড়','/images/books/book-ssc-physics.jpg','book'],
      ['9','গণিত মাস্টারবুক','নবম শ্রেণি • গণিত সমাধান',300,380,'','book-class9-math',4.8,143,'21% ছাড়','/images/books/book-class9-math.jpg','book'],

      /* ── নতুন ২টি বই (Dipu's English Mastery) ── */
      ['ssc',"Dipu's English Mastery 1st Paper",'SSC • Class 9 & 10 • 2026 & Beyond',380,480,'','book-english-mastery-1st',4.9,267,'21% ছাড়','/images/books/english-mastery-1st.jpg','book'],
      ['ssc',"Dipu's English Mastery 2nd Paper",'SSC • Class 9 & 10 • 2026 & Beyond',380,480,'','book-english-mastery-2nd',4.9,241,'21% ছাড়','/images/books/english-mastery-2nd.jpg','book'],

      /* ── ই-বুক (ছবি সহ) ── */
      ['ebook','পদার্থবিজ্ঞান PDF E-Book','HSC • ইনস্ট্যান্ট ডাউনলোড',199,350,'','ebook-hsc-physics-pdf',4.9,312,'43% ছাড়','/images/books/ebook-hsc-physics.jpg','ebook']
    ];

    /* Render star rating */
    function starsHTML(r) {
      const full = Math.floor(r);
      const half = r % 1 >= 0.5 ? 1 : 0;
      const empty = 5 - full - half;
      return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
    }

    /* Render book cards */
    const rail = document.getElementById('rail');
    rail.innerHTML = books.map((b, i) => {
      const isEbook = b[11] === 'ebook';
      const hasImg = b[10] && b[10].length > 0;
      const coverContent = hasImg
        ? `<img src="${b[10]}" alt="${b[1]}" loading="lazy" style="width:130px;height:185px;object-fit:cover;border-radius:4px 14px 14px 4px;box-shadow:-10px 14px 28px rgba(0,0,0,0.7);transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);transform:rotateY(-22deg) perspective(600px);" class="book-img-3d">`
        : `<div class="book-cover-3d" style="background:${b[5]}">
            <span class="book-label">${isEbook ? '📱 PDF E-Book' : "Dipu's Books"}</span>
            <span class="book-title">${b[1]}</span>
            <span class="book-sub">${b[2]}</span>
           </div>`;
      const ebookTag = isEbook ? `<span style="position:absolute;top:12px;left:12px;z-index:5;background:linear-gradient(135deg,#7c5cff,#4f46e5);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:6px;letter-spacing:0.3px;">PDF</span>` : '';
      return `
      <a href="/book?id=${b[6]}" class="card" data-c="${b[0]}" style="animation-delay:${i * 0.05}s" aria-label="${b[1]} - দাম ৳${b[3]}">
        <div class="cover-box">
          ${ebookTag}
          <span class="discount-badge">${b[9]}</span>
          ${coverContent}
        </div>
        <div class="card-info">
          <div>
            <h3>${b[1]}</h3>
            <div class="meta">
              <i class="fas fa-${isEbook ? 'file-pdf' : 'tag'}"></i>
              <span>${b[2]}</span>
            </div>
            <div class="card-stars">
              <span class="stars" aria-label="${b[7]} স্টার">${starsHTML(b[7])}</span>
              <span class="rating-count">${b[7]} (${b[8]})</span>
            </div>
          </div>
          <div class="price">
            <div class="price-group">
              <b>৳${b[3]}</b>
              <s>৳${b[4]}</s>
            </div>
            <span class="buy-btn">
              <i class="fas fa-${isEbook ? 'download' : 'cart-plus'}"></i> ${isEbook ? 'ডাউনলোড' : 'কিনুন'}
            </span>
          </div>
        </div>
      </a>`;
    }).join('');

    /* ============================================================
       HOVER & TILT EFFECTS — per card (no cross-card interference)
       ============================================================ */
    const isTouchDevice = () => window.matchMedia('(hover: none)').matches;

    document.querySelectorAll('.card').forEach(card => {
      const img = card.querySelector('.book-img-3d');

      /* Image 3D rotate on hover */
      card.addEventListener('mouseenter', () => {
        if (img) img.style.transform = 'rotateY(0) perspective(600px) scale(1.06)';
      });
      card.addEventListener('mouseleave', () => {
        if (img) img.style.transform = 'rotateY(-22deg) perspective(600px)';
        card.style.transform = ''; /* reset card tilt */
      });

      /* 3D card tilt — desktop only */
      card.addEventListener('mousemove', e => {
        if (isTouchDevice()) return;
        const r = card.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5;
        const y = (e.clientY - r.top) / r.height - 0.5;
        card.style.transform = `perspective(900px) rotateX(${-y * 6}deg) rotateY(${x * 8}deg) translateY(-8px)`;
      });
    });
    document.getElementById('pills').addEventListener('click', e => {
      const p = e.target.closest('.pill');
      if (!p) return;
      document.querySelectorAll('.pill').forEach(x => x.classList.toggle('on', x === p));
      document.querySelectorAll('.card').forEach(c => {
        c.classList.toggle('hide', p.dataset.c !== 'all' && c.dataset.c !== p.dataset.c);
      });
    });

    function resetFilters() {
      const allPill = document.querySelector('.pill[data-c="all"]');
      if (allPill) allPill.click();
    }

    /* Live Search */
    document.getElementById('shopSearchInput').addEventListener('input', e => {
      const q = e.target.value.toLowerCase().trim();
      document.querySelectorAll('.card').forEach(c => {
        const text = c.textContent.toLowerCase();
        c.classList.toggle('hide', q.length > 0 && !text.includes(q));
      });
    });




    /* ============================================================
       HERO BANNER SLIDER CONTROLLER
       ============================================================ */
    (function() {
      const track  = document.getElementById('heroTrack');
      const dots   = [...document.querySelectorAll('.slider-dot')];
      const slides = document.querySelectorAll('.hero-slide');
      let current  = 0;
      let autoTimer;
      const total  = slides.length;

      function goTo(idx) {
        current = ((idx % total) + total) % total;
        track.style.transform = `translateX(-${current * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle('active', i === current));
      }

      function startAuto() {
        clearInterval(autoTimer);
        autoTimer = setInterval(() => goTo(current + 1), 5000);
      }

      document.getElementById('sliderPrev').onclick = () => { goTo(current - 1); startAuto(); };
      document.getElementById('sliderNext').onclick = () => { goTo(current + 1); startAuto(); };

      dots.forEach(d => {
        d.onclick = () => { goTo(parseInt(d.dataset.idx)); startAuto(); };
      });

      /* Touch / Swipe support */
      let touchStartX = 0;
      const slider = document.getElementById('heroSlider');
      slider.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
      slider.addEventListener('touchend', e => {
        const diff = touchStartX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 50) {
          goTo(diff > 0 ? current + 1 : current - 1);
          startAuto();
        }
      }, { passive: true });

      goTo(0);
      startAuto();
    })();
  </script>

  <!-- React TypeScript Navbar Bundle & Global Animations Engine -->
  <script src="/js/navbar-bundle.js"></script>
  <script src="/js/site-animations.js" defer></script>
</body>
</html>

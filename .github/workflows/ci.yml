name: Dipu's Edu CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Environment Template
        run: test -f .env.example

      - name: Verify Core Source Structure
        run: |
          test -f src/server.js
          test -f src/config/db.js
          test -f src/middleware/auth.js
          test -f src/middleware/rateLimiter.js

      - name: Run Tests (if configured)
        run: |
          if [ -f "tests/auth.test.js" ]; then
            npm test
          else
            echo "No test files found, skipping unit test suite."
          fi
